<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 250px;
        }

        button {
            padding: 10px 25px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .card {
            width: 300px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px gray;
            display: none;
        }

        .card h2 {
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <input type="text" id="name" placeholder="Enter Student Name"><br>
    <input type="text" id="roll" placeholder="Enter Roll Number"><br>
    <input type="number" id="mark" placeholder="Enter Mark"><br>

    <button onclick="displayStudent()">Display Details</button>

    <div class="card" id="studentCard">
        <h2 id="studentName"></h2>
        <p><b>Roll Number:</b> <span id="studentRoll"></span></p>
        <p><b>Mark:</b> <span id="studentMark"></span></p>
        <p><b>Grade:</b> <span id="studentGrade"></span></p>
    </div>

    <script>
        function displayStudent() {
            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;
            let mark = Number(document.getElementById("mark").value);

            let grade;

            if (mark >= 90) {
                grade = "A+";
            } else if (mark >= 80) {
                grade = "A";
            } else if (mark >= 70) {
                grade = "B";
            } else if (mark >= 60) {
                grade = "C";
            } else if (mark >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            document.getElementById("studentName").innerHTML = name;
            document.getElementById("studentRoll").innerHTML = roll;
            document.getElementById("studentMark").innerHTML = mark;
            document.getElementById("studentGrade").innerHTML = grade;

            document.getElementById("studentCard").style.display = "block";
        }
    </script>

</body>
</html>
